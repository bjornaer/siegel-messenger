name: siegel
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: 6.8.1
  file_picker: 13.1.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  flutter_zxing: 3.1.0
  flutter_image_compress: 2.5.0
  image_picker: 1.2.3
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  phone_numbers_parser: ^9.0.28
  qr_flutter: 4.1.0
  record: 7.1.1
  video_compress: 3.1.4
  video_player: 2.14.0
  rust_lib_siegel:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    - assets/logo_dark.jpeg

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 28
  adaptive_icon_background: "#294D37" # the logo's forest green
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png # Android 13+ themed icons
  ios: true
  remove_alpha_ios: true
