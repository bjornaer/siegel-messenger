[package]
name = "rust_lib_siegel"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
core-api = { path = "../../core/core-api" }
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Smaller app download: the core ships once per CPU architecture.
[profile.release]
strip = true
lto = true
codegen-units = 1

# openmls_sqlite_storage 0.3 wants rusqlite 0.37, which can't build for the browser (vendor/…/VENDORED.md).
[patch.crates-io]
openmls_sqlite_storage = { path = "../../core/vendor/openmls_sqlite_storage" }

# M8: the web build shares memory between threads; wasm-opt has to be told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"] # accepts what rustc emitted; adds nothing
