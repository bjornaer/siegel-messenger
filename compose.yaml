# Full stack: docker compose up -d --build
# Secrets come from .env (see .env.example). Unset values fall back to dev-only defaults.
# OpenBao profiles (COMPOSE_PROFILES):
#   localbao  throwaway in-memory OpenBao, auto-configured: local development.
#   bao       persistent OpenBao on this host, manual init/unseal: single-server test deploy.
# ponytail: "bao" puts the pepper on the DB host; move OpenBao to its own server before public launch (docs/deploy.md).
# Backups: one copy each in ${BACKUP_DIR}, overwritten every BACKUP_INTERVAL seconds.
# Keep the interval <= 24h so deleted account data ages out of backups too (ID-16, section 10 retention).

services:
  postgres:
    image: postgres:18.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siegel}
      POSTGRES_DB: siegel
    volumes: [pgdata:/var/lib/postgresql]
    ports: ["127.0.0.1:55432:5432"] # loopback only: never expose the DB on the public interface
    healthcheck:
      test: pg_isready -U postgres
      interval: 1s
      retries: 30

  s3: # ARCH-06: S3-compatible store for encrypted attachment blobs
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-siegel}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-siegelsecret}
    entrypoint:
      - sh
      - -c
      - |
        printf '{"identities":[{"name":"siegel","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json
    volumes: [s3data:/data]
    ports: ["127.0.0.1:58333:8333"]

  server:
    # SEC-03: logs that may name an account are kept 7 days at most. In production set
    # LOG_DRIVER=journald with journald's MaxRetentionSec=7day (docs/deploy.md).
    logging:
      driver: ${LOG_DRIVER:-json-file}
    build: server
    restart: unless-stopped
    environment:
      SIEGEL_DEV: ${SIEGEL_DEV:-1}
      SIEGEL_DOMAIN: ${SIEGEL_DOMAIN:-}
      SIEGEL_DATABASE_URL: postgres://postgres@postgres:5432/siegel
      PGPASSWORD: ${POSTGRES_PASSWORD:-siegel} # separate var: base64 passwords contain "/" and "+", which break URLs
      SIEGEL_BAO_ADDR: ${SIEGEL_BAO_ADDR:-http://openbao:8200}
      SIEGEL_BAO_TOKEN: ${SIEGEL_BAO_TOKEN:-dev-root}
      SIEGEL_GATEWAYAPI_TOKEN: ${SIEGEL_GATEWAYAPI_TOKEN:-}
      SIEGEL_GATEWAYAPI_URL: ${SIEGEL_GATEWAYAPI_URL:-https://messaging.gatewayapi.eu/mobile/single}
      SIEGEL_SEVEN_API_KEY: ${SIEGEL_SEVEN_API_KEY:-}
      SIEGEL_SMS_PROVIDERS: ${SIEGEL_SMS_PROVIDERS:-gatewayapi,seven}
      SIEGEL_SMS_SENDER: ${SIEGEL_SMS_SENDER:-Siegel}
      SIEGEL_ALERT_WEBHOOK: ${SIEGEL_ALERT_WEBHOOK:-}
      SIEGEL_INACTIVE_DAYS: ${SIEGEL_INACTIVE_DAYS:-180}
      SIEGEL_CONTACT_EMAIL: ${SIEGEL_CONTACT_EMAIL:-}
      # CMP-03: the moderators' age public key (age1...). Its private key never goes on a server.
      SIEGEL_REPORTS_AGE_RECIPIENT: ${SIEGEL_REPORTS_AGE_RECIPIENT:-}
      # M7: the moderation console, published on the host's loopback only (ssh -L 9443:127.0.0.1:9443).
      SIEGEL_CONSOLE_ADDR: ":9443"
      # M8: the web app's origin (https://web.siegel.schlk.in) for CORS and the stream; empty = off.
      SIEGEL_WEB_ORIGIN: ${SIEGEL_WEB_ORIGIN:-}
      SIEGEL_WEB_DIR: /web # deploy.sh unpacks each release of the site here (current -> it)
      SIEGEL_VAPID_KEY: ${SIEGEL_VAPID_KEY:-} # M8: Web Push (siegel-admin vapid-keygen); empty = none
      SIEGEL_ANDROID_LATEST_BUILD: ${SIEGEL_ANDROID_LATEST_BUILD:-0}
      SIEGEL_ANDROID_MIN_BUILD: ${SIEGEL_ANDROID_MIN_BUILD:-0}
      SIEGEL_ANDROID_CERT_SHA256: ${SIEGEL_ANDROID_CERT_SHA256:-}
      SIEGEL_OPERATOR: ${SIEGEL_OPERATOR:-}
      SIEGEL_REVIEW_PHONE: ${SIEGEL_REVIEW_PHONE:-}
      SIEGEL_FCM_CREDENTIALS: ${SIEGEL_FCM_CREDENTIALS:-}
      SIEGEL_REVIEW_CODE: ${SIEGEL_REVIEW_CODE:-}
      SIEGEL_OTP_PER_IP_HOUR: ${SIEGEL_OTP_PER_IP_HOUR:-10}
      SIEGEL_OTP_PER_NUMBER_DAY: ${SIEGEL_OTP_PER_NUMBER_DAY:-5}
      SIEGEL_OTP_RESEND_WAIT: ${SIEGEL_OTP_RESEND_WAIT:-30s}
      SIEGEL_VERIFY_PER_IP_HOUR: ${SIEGEL_VERIFY_PER_IP_HOUR:-30}
      SIEGEL_NEW_CHATS_PER_DAY: ${SIEGEL_NEW_CHATS_PER_DAY:-50}
      SIEGEL_LOOKUP_PER_DAY: ${SIEGEL_LOOKUP_PER_DAY:-1000}
      SIEGEL_DENY_PREFIXES: ${SIEGEL_DENY_PREFIXES:-}
      SIEGEL_SMS_DAILY_CAP: ${SIEGEL_SMS_DAILY_CAP:-1000}
      SIEGEL_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-siegel}
      SIEGEL_S3_SECRET_KEY: ${S3_SECRET_KEY:-siegelsecret}
      SIEGEL_S3_BUCKET: ${S3_BUCKET:-siegel-attachments}
      SIEGEL_BLOB_DAYS: ${SIEGEL_BLOB_DAYS:-30}
      SIEGEL_UPLOADS_PER_DAY: ${SIEGEL_UPLOADS_PER_DAY:-1000}
    ports:
      - "${SIEGEL_HTTP_PORT:-58080}:8080"   # plain API without SIEGEL_DOMAIN; ACME + HTTPS redirect with it
      - "${SIEGEL_HTTPS_PORT:-58443}:8443"  # TLS 1.3, Let's Encrypt (ARCH-02)
      - "127.0.0.1:9443:9443"               # M7 moderation console: loopback only, never public
    volumes: [certs:/certs, ./web-site:/web:ro] # web-site: the web app, from CI (scripts/deploy.sh)
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
      bao-init: {condition: service_completed_successfully, required: false}

  openbao: # dev only: in-memory, keys vanish on restart (local accounts then become unreachable)
    image: openbao/openbao:2.4.1
    profiles: [localbao]
    command: server -dev -dev-root-token-id=dev-root -dev-listen-address=0.0.0.0:8200
    ports: ["127.0.0.1:58200:8200"]

  bao-init:
    image: openbao/openbao:2.4.1
    profiles: [localbao]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: dev-root
    entrypoint: ["sh", "-c", "until bao status >/dev/null 2>&1; do sleep 1; done; exec /bao-setup.sh"]
    volumes: ["./scripts/bao-setup.sh:/bao-setup.sh:ro"]
    depends_on: [openbao]

  bao: # single-server deploy: persistent, starts sealed (docs/deploy.md)
    image: openbao/openbao:2.4.1
    profiles: [bao]
    restart: unless-stopped
    command: server -config=/openbao/config/bao.hcl
    volumes:
      - ./infra/openbao/bao.hcl:/openbao/config/bao.hcl:ro
      - ./scripts/bao-setup.sh:/bao-setup.sh:ro
      - baodata:/openbao/file

  postgres-backup:
    image: postgres:18.0-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-siegel}
      INTERVAL: ${BACKUP_INTERVAL:-86400}
      # age public key (docs/deploy.md); its private key stays offline. Unset: plain dump (dev).
      RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    entrypoint:
      - sh
      - -c
      - |
        set -o pipefail
        umask 077
        case "$$RECIPIENT" in
          ""|age1*) ;;
          *) echo "BACKUP_AGE_RECIPIENT must be the PUBLIC key (age1...), never the secret key"; exit 1 ;;
        esac
        if [ -n "$$RECIPIENT" ]; then
          until apk add -q --no-cache age; do sleep 30; done
          out=postgres.dump.age
        else
          echo "BACKUP_AGE_RECIPIENT unset: backup is NOT encrypted"
          out=postgres.dump
        fi
        while true; do
          if [ -n "$$RECIPIENT" ]; then
            pg_dump -h postgres -U postgres -Fc siegel | age -r "$$RECIPIENT" > /backups/$$out.tmp
          else
            pg_dump -h postgres -U postgres -Fc siegel > /backups/$$out.tmp
          fi &&
            mv /backups/$$out.tmp /backups/$$out && echo "postgres backup ok ($$out)" &&
            if [ -n "$$RECIPIENT" ]; then rm -f /backups/postgres.dump; fi
          sleep "$$INTERVAL"
        done
    volumes: ["${BACKUP_DIR:-./backups}:/backups"]
    depends_on:
      postgres: {condition: service_healthy}

  s3-backup:
    image: rclone/rclone:1.71.1
    restart: unless-stopped
    environment:
      INTERVAL: ${BACKUP_INTERVAL:-86400}
      BUCKET: ${S3_BUCKET:-siegel-attachments}
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: SeaweedFS
      RCLONE_CONFIG_S3_ENDPOINT: http://s3:8333
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-siegel}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-siegelsecret}
    entrypoint:
      - sh
      - -c
      - |
        until rclone mkdir "s3:$$BUCKET"; do sleep 2; done
        while true; do
          rclone sync "s3:$$BUCKET" /backups/bucket && echo "bucket backup ok" # mirror: overwrites the previous copy
          sleep "$$INTERVAL"
        done
    volumes: ["${BACKUP_DIR:-./backups}:/backups"]
    depends_on: [s3]

volumes:
  pgdata:
  s3data:
  certs:
  baodata:
