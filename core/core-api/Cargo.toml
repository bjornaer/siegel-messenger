[package]
name = "core-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-crypto = { path = "../core-crypto" }
core-media = { path = "../core-media" }
core-net = { path = "../core-net" }
core-store = { path = "../core-store" }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
# Exposes the parsers of untrusted input to core/fuzz (SEC-08). Never on in the app.
fuzzing = []

[dev-dependencies]
age = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
