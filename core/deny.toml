# SEC-07 / D15: every dependency must be AGPL-3.0 compatible and free of known vulnerabilities.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable: a compile-time proc-macro helper (hax-lib-macros <- libcrux,
  # OpenMLS's crypto). No code from it ships in the app. Revisit when libcrux drops it.
  { id = "RUSTSEC-2026-0173", reason = "build-time only, unmaintained notice" },
  # Unmaintained, not vulnerable: read at compile time by age's i18n proc-macros (basic-toml <-
  # i18n-config <- i18n-embed-fl <- age, used for reports and device links). Nothing ships.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, unmaintained notice" },
  # Timing leaks in crypto-bigint 0.5 (fixed only in 0.7.6), reached only through elliptic-curve
  # 0.13 for P-256/P-384/K-256 under OpenMLS. We only use X25519/Ed25519 (CIPHERSUITE in
  # core-crypto/src/mls.rs), so no secret goes through it. Revisit when OpenMLS moves to 0.7.
  { id = "RUSTSEC-2026-0387", reason = "NIST/secp curves unused: X25519/Ed25519 suite only" },
  # SQLite < 3.54 with a crafted database and -wal pair (local). Ours live in app-private storage:
  # whoever can plant files there has the data already. The fix (sqlcipher-src 420) needs
  # rusqlite 0.42, which refinery 0.10.1 doesn't take yet: bump both together.
  { id = "RUSTSEC-2026-0502", reason = "local crafted db/wal pair; app-private storage; fix blocked on refinery" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "MPL-2.0", "Zlib", "0BSD", "Unlicense", "Unicode-3.0", "CDLA-Permissive-2.0", "AGPL-3.0-only", "OpenSSL",
]
confidence-threshold = 0.9
# SQLCipher's sources, split out of libsqlite3-sys 0.39: SQLite's public-domain blessing and
# libtomcrypt's WTFPL, both permissive. Allowed for this crate only.
exceptions = [{ crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] }]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
