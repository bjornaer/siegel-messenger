[package]
name = "core-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openmls_sqlite_storage = "0.3"
serde = "1"
serde_json = "1"
rusqlite = "0.39"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }

# The browser (M8): SQLite3 Multiple Ciphers writing the SQLCipher format, kept in IndexedDB.
[target.'cfg(target_family = "wasm")'.dependencies]
sqlite-wasm-rs = { version = "0.5", features = ["sqlite3mc"] }
sqlite-wasm-vfs = "0.2"
