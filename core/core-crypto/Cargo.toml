[package]
name = "core-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
openmls = "0.9.1"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
openmls_rust_crypto = "0.6"
