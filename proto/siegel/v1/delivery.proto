syntax = "proto3";

package siegel.v1;

option go_package = "github.com/bjornaer/siegel-messenger/server/gen/siegel/v1;siegelv1";

// The Delivery Service (ARCH-04). Payloads are raw MLS messages (PrivateMessage, commit or
// Welcome); the server never parses them and never stores who sent them.

message DeviceAddress {
  bytes account_id = 1;
  bytes device_id = 2;
}

service KeysService {
  // Adds one-time KeyPackages for the caller's device and optionally replaces its last-resort
  // KeyPackage (CRY-09). Returns how many one-time packages remain, so clients refill below 20.
  rpc Upload(KeysServiceUploadRequest) returns (KeysServiceUploadResponse);
  // Claims one KeyPackage per device of an account (GRP-09). One-time packages are deleted on
  // claim; the last-resort package is returned when none are left. Rate-limited per caller.
  rpc Claim(KeysServiceClaimRequest) returns (KeysServiceClaimResponse);
}

message KeysServiceUploadRequest {
  repeated bytes key_packages = 1;
  bytes last_resort = 2;
  // Drop this device's unused one-time KeyPackages first: an app update that changes their
  // capabilities (e.g. group support) replaces the old ones.
  bool replace = 3;
}

message KeysServiceUploadResponse {
  uint32 remaining = 1;
}

message KeysServiceClaimRequest {
  bytes account_id = 1;
}

message ClaimedKeyPackage {
  bytes device_id = 1;
  bytes key_package = 2;
}

message KeysServiceClaimResponse {
  repeated ClaimedKeyPackage key_packages = 1;
}

service MessagesService {
  // Sealed sender (MSG-10): no authentication, so the server learns recipients but not the
  // sender. Each recipient needs its delivery token, which only holders of its profile key can
  // derive. Rate-limited per IP.
  rpc SendSealed(MessagesServiceSendSealedRequest) returns (MessagesServiceSendSealedResponse);
  // Queues one payload for each recipient device, authenticated. For first contact with
  // non-contacts, whose messages land in message requests (MSG-15).
  rpc SendIdentified(MessagesServiceSendIdentifiedRequest) returns (MessagesServiceSendIdentifiedResponse);
}

message SealedRecipient {
  DeviceAddress address = 1;
  bytes delivery_token = 2;
}

message MessagesServiceSendSealedRequest {
  repeated SealedRecipient recipients = 1;
  bytes payload = 2;
}

message MessagesServiceSendSealedResponse {
  repeated DeviceAddress revoked = 1;
  // Recipients whose token did not match (profile key rotated, e.g. after a block). Nothing
  // was queued for them; the client may retry identified.
  repeated DeviceAddress rejected = 2;
}

message MessagesServiceSendIdentifiedRequest {
  repeated DeviceAddress recipients = 1;
  bytes payload = 2;
}

message MessagesServiceSendIdentifiedResponse {
  // Recipients whose device no longer exists; the payload was not queued for them (ID-13).
  repeated DeviceAddress revoked = 1;
}

service GroupsService {
  // Submits the commit that moves a group from `epoch` to `epoch + 1`. Exactly one commit per
  // epoch is accepted (first writer wins); a loser gets ABORTED "epoch_conflict", receives the
  // winning commit from its queue, applies it and retries (CRY-14). Epoch 0 creates the group.
  rpc Commit(GroupsServiceCommitRequest) returns (GroupsServiceCommitResponse);
}

message GroupsServiceCommitRequest {
  bytes group_id = 1;
  uint64 epoch = 2;
  bytes commit = 3;
  repeated DeviceAddress recipients = 4;
  bytes welcome = 5;
  repeated DeviceAddress welcome_recipients = 6;
}

message GroupsServiceCommitResponse {
  repeated DeviceAddress revoked = 1;
}

// WebSocket /v1/stream frames (SRV-03), binary protobuf. Server -> client: StreamFrame.
// Client -> server: StreamAck. Queued messages are deleted once acknowledged.
message StreamFrame {
  oneof kind {
    QueuedMessage message = 1;
    // The device was revoked or the account deleted: wipe keys and local data (ID-12).
    Deregistered deregistered = 2;
  }
}

message QueuedMessage {
  int64 id = 1;
  bytes payload = 2;
}

message Deregistered {}

message StreamAck {
  repeated int64 ids = 1;
}

// GRP-16: group invite links. The server keeps only the group's snapshot encrypted with the
// link key, which it never sees; it can't tell which group an invite belongs to.
service InvitesService {
  // Creates or refreshes an invite's snapshot. The first write sets the write key; later
  // writes must present it (members have it, people holding only the link don't). Auth: device.
  rpc Put(InvitesServicePutRequest) returns (InvitesServicePutResponse);
  // The encrypted snapshot, for someone opening the link. Auth: device.
  rpc Get(InvitesServiceGetRequest) returns (InvitesServiceGetResponse);
  // Revokes an invite. Auth: device.
  rpc Delete(InvitesServiceDeleteRequest) returns (InvitesServiceDeleteResponse);
}

message InvitesServicePutRequest {
  bytes id = 1;        // 16 random bytes
  bytes write_key = 2; // 16 random bytes
  bytes snapshot = 3;  // encrypted with the link key
  int64 expires_at = 4; // unix seconds
}

message InvitesServicePutResponse {}

message InvitesServiceGetRequest {
  bytes id = 1;
}

message InvitesServiceGetResponse {
  bytes snapshot = 1;
  int64 expires_at = 2;
}

message InvitesServiceDeleteRequest {
  bytes id = 1;
  bytes write_key = 2;
}

message InvitesServiceDeleteResponse {}
