syntax = "proto3";

package siegel.v1;

option go_package = "github.com/bjornaer/siegel-messenger/server/gen/siegel/v1;siegelv1";

// Errors are Connect error codes; the message is a stable machine string
// (for example "otp_invalid", "registration_lock_required").

service RegistrationService {
  // Sends an OTP by SMS (ID-01 to ID-04). Auth: attestation token.
  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse);
  // Verifies the OTP and, if set, the Registration Lock PIN (ID-03, ID-09, ID-10).
  // Re-registering an existing number revokes every old device.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // The newest published app build and the oldest still allowed, so the app can prompt an
  // update. Public: no account needed.
  rpc AppVersion(AppVersionRequest) returns (AppVersionResponse);
}

message RequestOtpRequest {
  string phone_e164 = 1;
  // ID-02: Play Integrity token whose requestHash is hex(SHA-256(phone_e164)); App Attest on iOS.
  string attestation_token = 2;
  Platform platform = 3;
}

message RequestOtpResponse {
  // When the app may offer "Resend code": each resend waits twice as long (ID-04).
  uint32 resend_after_seconds = 1;
}

message VerifyRequest {
  string phone_e164 = 1;
  string otp = 2;
  // Ed25519 Account Identity public key (CRY-06), 32 bytes.
  bytes identity_pub = 3;
  // Required only when the account has an active Registration Lock.
  string registration_lock_pin = 4;
  Platform platform = 5;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
}

message VerifyResponse {
  bytes account_id = 1; // 16-byte UUID
  bytes device_id = 2;  // 16-byte UUID
  // Bearer token for authenticated calls. Shown once; the server keeps only its hash.
  string device_token = 3;
  // Authentication Service Ed25519 signature over
  // "siegel-as-v1" || account_id || identity_pub (CRY-08).
  bytes as_signature = 4;
  // True when the account already existed (re-registration, ID-09).
  bool existing_account = 5;
  // Authentication Service Ed25519 public key. Clients pin it here and use it to check
  // every member's credential binding (CRY-08).
  bytes as_public_key = 6;
  // Re-registration (ID-09): the account's current @username, so the app needn't ask again.
  string username = 7;
  // Re-registration: the account already has a Registration Lock PIN (ID-10).
  bool registration_lock = 8;
}

service UsernameService {
  // Claim or change the caller's @username (ID-06, ID-07). Auth: device.
  rpc Set(UsernameServiceSetRequest) returns (UsernameServiceSetResponse);
  // Exact-match lookup only (ID-08, DISC-01). Auth: device.
  rpc Lookup(UsernameServiceLookupRequest) returns (UsernameServiceLookupResponse);
}

message UsernameServiceSetRequest {
  string username = 1;
}

message UsernameServiceSetResponse {}

message UsernameServiceLookupRequest {
  string username = 1;
}

message UsernameServiceLookupResponse {
  bytes account_id = 1;
  bytes identity_pub = 2;
  bytes as_signature = 3;
}

service AccountService {
  // Set (4-digit PIN) or, with an empty pin, remove the Registration Lock (ID-10). Auth: device.
  rpc SetRegistrationLock(SetRegistrationLockRequest) returns (SetRegistrationLockResponse);
  // Deletes all server-side data for the account (ID-16). Auth: device.
  rpc Delete(AccountServiceDeleteRequest) returns (AccountServiceDeleteResponse);
  // This device's FCM or APNs token; empty clears it (MSG-17, SRV-05). Auth: device.
  rpc SetPushToken(SetPushTokenRequest) returns (SetPushTokenResponse);
  // Moves the account to a new number, proven with an OTP from RequestOtp, plus the
  // Registration Lock PIN if one is set. At most once per 7 days. A number held by another
  // account moves too; that account keeps everything but its number (docs/change-number.md).
  rpc ChangeNumber(ChangeNumberRequest) returns (ChangeNumberResponse);
  // Everything the server holds about the caller's account (CMP-06, RM-01). Auth: device.
  rpc Export(AccountServiceExportRequest) returns (AccountServiceExportResponse);
}

message AccountServiceExportRequest {}

// Days are YYYY-MM-DD (UTC), empty when unset. Message contents are never readable here.
message AccountServiceExportResponse {
  bytes account_id = 1;
  bytes phone_hmac = 2; // HMAC of the number (ID-05); empty after another account took it
  string created_day = 3;
  string number_changed_day = 4;
  bytes identity_pub = 5;
  string username = 6;
  string username_claimed_day = 7;
  repeated string released_usernames = 8; // still reclaimable by this account (ID-07)
  bool registration_lock = 9;
  bool discoverable = 10;
  bool profile = 11; // encrypted; the server can't read it (MSG-10)
  bool profile_picture = 12; // encrypted blob
  int32 numbers_checked = 13; // contact numbers checked this key period (DISC-06)
  repeated ExportedDevice devices = 14;
}

message ExportedDevice {
  bytes device_id = 1;
  Platform platform = 2;
  string last_seen_day = 3;
  bool push_token = 4;
  int32 queued = 5; // encrypted messages waiting for it
  int32 key_packages = 6;
  bool this_device = 7;
}

message ChangeNumberRequest {
  string phone_e164 = 1;
  string otp = 2;
  string registration_lock_pin = 3;
}

message ChangeNumberResponse {}

message SetPushTokenRequest {
  string push_token = 1;
}

message SetPushTokenResponse {}

message SetRegistrationLockRequest {
  string pin = 1;
}

message SetRegistrationLockResponse {}

message AccountServiceDeleteRequest {}

message AccountServiceDeleteResponse {}

service ProfileService {
  // Stores the caller's encrypted profile and the hash of its delivery token (MSG-10). The
  // server cannot read the profile; only contacts hold the profile key. Auth: device.
  rpc Set(ProfileServiceSetRequest) returns (ProfileServiceSetResponse);
  // Fetches an account's encrypted profile. Auth: device.
  rpc Get(ProfileServiceGetRequest) returns (ProfileServiceGetResponse);
}

message ProfileServiceSetRequest {
  bytes encrypted_profile = 1; // at most 4 KiB
  bytes delivery_token_verifier = 2; // SHA-256 of the delivery token, 32 bytes
  // MED-15: the uploaded blob holding the encrypted profile picture, kept while it is current;
  // the previous one expires. Empty when there is no picture.
  bytes avatar_blob_id = 3;
}

message ProfileServiceSetResponse {}

message ProfileServiceGetRequest {
  bytes account_id = 1;
}

message ProfileServiceGetResponse {
  bytes encrypted_profile = 1;
}

message AppVersionRequest {
  Platform platform = 1;
}

message AppVersionResponse {
  uint32 latest = 1;  // build number in the store; 0 = unknown
  uint32 minimum = 2; // older builds must update; 0 = none
}

// M5 phone-number discovery (DISC-03..07, docs/discovery.md). The server never sees an address
// book: clients send blinded points, and the directory entries are encrypted to the OPRF output.
service DiscoveryService {
  // DISC-03: turns "find me by my number" on (with our own number, checked against the
  // account) or off (empty). Auth: device.
  rpc SetDiscoverable(DiscoveryServiceSetDiscoverableRequest) returns (DiscoveryServiceSetDiscoverableResponse);
  rpc GetDiscoverable(DiscoveryServiceGetDiscoverableRequest) returns (DiscoveryServiceGetDiscoverableResponse);
  // DISC-05.3: the OPRF on blinded points. Rate-limited (DISC-06). Auth: device.
  rpc Evaluate(DiscoveryServiceEvaluateRequest) returns (DiscoveryServiceEvaluateResponse);
  // DISC-05.5: whole buckets of encrypted directory entries. Auth: device.
  rpc Buckets(DiscoveryServiceBucketsRequest) returns (DiscoveryServiceBucketsResponse);
}

message DiscoveryServiceSetDiscoverableRequest {
  string phone_e164 = 1; // empty: off
}

message DiscoveryServiceSetDiscoverableResponse {}

message DiscoveryServiceGetDiscoverableRequest {}

message DiscoveryServiceGetDiscoverableResponse {
  bool on = 1;
}

message DiscoveryServiceEvaluateRequest {
  repeated bytes blinded = 1; // ristretto255 points, 32 bytes each
}

message DiscoveryServiceEvaluateResponse {
  repeated bytes evaluated = 1; // in the same order
  int64 period = 2;             // key period these belong to
  uint32 bucket_bits = 3;       // how many leading bits of an entry ID pick its bucket
}

message DiscoveryServiceBucketsRequest {
  int64 period = 1;
  repeated uint32 buckets = 2;
}

message DiscoveryServiceBucketsResponse {
  repeated DirectoryEntry entries = 1;
}

// One discoverable account: `id` and the key that opens `box` both come from the OPRF output for
// their number, so only someone who has the number can find or read it.
message DirectoryEntry {
  bytes id = 1;  // 16 bytes
  bytes box = 2; // nonce, then AES-256-GCM of the @username
}
