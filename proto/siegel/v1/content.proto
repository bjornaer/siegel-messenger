syntax = "proto3";

package siegel.v1;

option go_package = "github.com/bjornaer/siegel-messenger/server/gen/siegel/v1;siegelv1";

// MSG-01: the plaintext inside every MLS application message. Only clients see it; the
// server never receives it outside MLS ciphertext. Receivers ignore bodies they don't know
// (forward compatibility), so new MSG-02 types can be added without breaking old clients.
message Content {
  bytes message_id = 1; // UUIDv7, set by the sender
  int64 sent_at = 2;    // sender clock, ms since the Unix epoch
  oneof body {
    Text text = 3;
    ProfileKeyUpdate profile_key_update = 4;
    Reaction reaction = 5;
    Edit edit = 6;
    Delete delete = 7;
    Receipt receipt = 8;
    Typing typing = 9;
    KeyChange key_change = 15;
    GroupEvent group_event = 16;
    ContactLinkProof contact_link = 17;
    Attachment attachment = 18;
    Sync sync = 19; // M8: only to our own other devices, never to anyone else
  }
}

// M8 part 2: keeps our own devices in step. Sent in the conversation it's about, addressed to our
// own account only; anyone else's devices never receive it.
message Sync {
  oneof kind {
    SyncRead read = 1;
    SyncContact contact = 2;
    SyncSetting setting = 3;
  }
}

// Read on another device, up to and including this send time.
message SyncRead {
  int64 up_to = 1;
}

// The other person in this 1:1 chat: 0 request, 1 accepted, 2 blocked.
message SyncContact {
  int32 state = 1;
}

// A per-chat setting the app keeps under "<name>.<chat ID>" (archive, mute, hidden).
message SyncSetting {
  string name = 1;
  string value = 2;
}

// DISC-08: sent by whoever opened someone's contact link, in the chat it started. The secret
// came from the link's fragment, which only the link's owner handed out; their app then skips
// the message request.
message ContactLinkProof {
  bytes secret = 1;
}

// MSG-02 group_event, GRP-12: a system line the client stores locally ("Ana added Igor") when
// it processes a membership or metadata commit. Never sent; receivers ignore it on the wire.
message GroupEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_ADDED = 2;
    KIND_REMOVED = 3;
    KIND_LEFT = 4;
    KIND_RENAMED = 5;
    KIND_ADMIN_ADDED = 6;
    KIND_ADMIN_REMOVED = 7;
    KIND_SETTINGS = 8;
    KIND_AVATAR = 9; // MED-15: the group picture changed or was removed
  }
  Kind kind = 1;
  bytes actor = 2;              // account that made the change; empty when unknown
  repeated bytes targets = 3;   // accounts it affected
  string name = 4;              // KIND_RENAMED: the new name
}

// CRY-13: a notice the client stores locally when a contact's identity key changes. Never
// sent; receivers ignore it if it arrives over the wire.
message KeyChange {}

// MSG-02 profile_key_update: shares the sender's profile key with the group, which lets
// receivers fetch and decrypt the sender's profile and derive its delivery token (MSG-10).
message ProfileKeyUpdate {
  bytes profile_key = 1;
}

// The plaintext of an encrypted profile (server stores only the ciphertext).
message Profile {
  string display_name = 1;
  string username = 2;
  Attachment avatar = 3; // MED-15: blob_id, key, sha256, size and type of the picture; unset when none
  bytes padding = 15; // fills the plaintext to a 256-byte bucket so name length stays hidden
}

// MED-04: a file sent in the chat. The blob on the server is the file encrypted with `key`
// (MED-01) and padded (MED-02); only this message, inside MLS, links the two.
message Attachment {
  bytes blob_id = 1;
  bytes key = 2;          // AES-256-GCM STREAM key, fresh per file
  bytes sha256 = 3;       // of the uploaded ciphertext, padding included (MED-05)
  int64 size = 4;         // plaintext bytes
  string mime_type = 5;
  string file_name = 6;   // empty for voice notes
  uint32 width = 7;       // images and video
  uint32 height = 8;
  uint32 duration_ms = 9; // audio and video
  bytes thumbnail = 10;   // images and video, at most 20 KB
  bool voice_note = 11;   // MED-09: recorded in the app
  bytes waveform = 12;    // MED-09: voice note loudness, one byte (0-255) per bar
  bytes reply_to = 13;    // MSG-07, as in Text
  bool sticker = 14;      // a WebP or PNG sticker: shown large, without a bubble (older apps show a photo)
  bool view_once = 15;    // M9: opened once on the recipient's phone, then gone everywhere; no thumbnail
}

message Text {
  string body = 1; // MSG-05: up to 64 KB UTF-8
  bytes reply_to = 2; // MSG-07 reply: the quoted message_id, empty when not a reply
  repeated bytes mentions = 3; // GRP-15: accounts @mentioned in the text
}

// MSG-08: one emoji per sender per message; a new one replaces it, empty removes it.
message Reaction {
  bytes message_id = 1;
  string emoji = 2;
}

// MSG-09: new text for the sender's own message, within 15 minutes of sending it.
message Edit {
  bytes message_id = 1;
  string body = 2;
}

// MSG-11: delete for everyone, within 48 hours of sending.
message Delete {
  bytes message_id = 1;
}

// MSG-13: delivery receipts always; read receipts only when both sides have them on.
message Receipt {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DELIVERED = 1;
    KIND_READ = 2;
    KIND_OPENED = 3; // M9: a view-once photo was opened (follows the read-receipts setting)
  }
  Kind kind = 1;
  repeated bytes message_ids = 2;
}

// MSG-14: sent at most every 3 seconds while typing.
message Typing {}
