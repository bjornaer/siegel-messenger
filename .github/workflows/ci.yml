name: ci
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_PASSWORD: siegel
          POSTGRES_DB: siegel
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 1s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: proto lint and generated code up to date
        run: go tool buf lint .. && go tool buf generate .. && git diff --exit-code
      - name: OpenBao for transit tests
        run: |
          docker run -d --name bao -p 8200:8200 -v "$PWD/../scripts:/s:ro" openbao/openbao:2.4.1 \
            server -dev -dev-root-token-id=dev-root -dev-listen-address=0.0.0.0:8200
          docker exec -e BAO_ADDR=http://127.0.0.1:8200 -e BAO_TOKEN=dev-root bao \
            sh -c 'until bao status >/dev/null 2>&1; do sleep 1; done; /s/bao-setup.sh'
      - run: go test -race ./...
        env:
          SIEGEL_TEST_DATABASE_URL: postgres://postgres:siegel@localhost:5432/postgres
          SIEGEL_TEST_BAO_ADDR: http://localhost:8200
      - name: vulnerabilities (SEC-07)
        run: go tool govulncheck ./...
      - name: licences compatible with AGPL-3.0 (SEC-07, D15)
        # ponytail: own module ignored until it ships a LICENSE (OQ-005).
        run: >
          go tool go-licenses check ./...
          --ignore github.com/bjornaer/siegel-messenger
          --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Zlib,0BSD,Unlicense,AGPL-3.0,GPL-3.0,LGPL-2.1,LGPL-3.0

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: core-${{ hashFiles('core/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p core-api --features fuzzing -- -D warnings # the hooks core/fuzz uses (SEC-08)
      # ponytail: e2e test (core-api/tests/e2e.rs) skips here; run it against the compose stack once CI starts one.
      - run: cargo test
      - name: licences and advisories (SEC-07, D15)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml

  # M8: the same core, built for the browser (docs/m8-wasm-spike.md). Needs a wasm-capable clang
  # for SQLite3 Multiple Ciphers, which the runner has.
  core-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal -c clippy -t wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: core-web-${{ hashFiles('core/Cargo.lock') }}
      - run: cargo clippy -p core-api --target wasm32-unknown-unknown -- -D warnings

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: generated bindings up to date
        # ponytail: checks the Dart side only; regenerate with flutter_rust_bridge_codegen generate after Rust API changes.
        run: flutter gen-l10n && git diff --exit-code -- lib
      - name: bridge crate licences and advisories (SEC-07)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/rust/Cargo.toml

  # M8: the web app (web.siegel.schlk.in): the core through wasm-pack, then Flutter. The built
  # site is kept as an artifact; part 5 serves it.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter_rust_bridge's web build: nightly for build-std, threads through shared memory.
      - run: rustup toolchain install nightly --profile minimal -c rust-src -t wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            app/rust/target
          key: web-${{ hashFiles('app/rust/Cargo.lock') }}
      - run: flutter pub get
      - name: core for the browser
        env:
          # SQLite3 Multiple Ciphers is C: built for the same shared memory as the Rust around it.
          CFLAGS_wasm32_unknown_unknown: -matomics -mbulk-memory
        run: >-
          dart run flutter_rust_bridge build-web --release --dart-root "$PWD" --wasm-pack-rustflags='--cfg getrandom_backend="wasm_js"
          -C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-args=--shared-memory
          -C link-args=--max-memory=1073741824 -C link-args=--import-memory -C link-args=--export=__heap_base
          -C link-args=--export=__wasm_init_tls -C link-args=--export=__tls_size -C link-args=--export=__tls_align
          -C link-args=--export=__tls_base'
      - run: flutter build web --release --no-web-resources-cdn
      - run: ls -la build/web build/web/pkg && du -sh build/web
      - uses: actions/upload-artifact@v4
        with:
          name: siegel-web
          path: app/build/web

  e2e:
    # Headless Rust clients against the real stack (section 15 end-to-end tests, AC-01).
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: localbao
      SIEGEL_OTP_PER_IP_HOUR: "10000"
      SIEGEL_VERIFY_PER_IP_HOUR: "10000"
      SIEGEL_NEW_CHATS_PER_DAY: "10000"
      # Test-only moderators' key (core/core-api/tests/reports-test.key), for the report e2e test.
      SIEGEL_REPORTS_AGE_RECIPIENT: age1myv2g8hn04vm97gunmmnfeacw4l09xsv502uvpnx03tljamm9vdqhe482x
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: e2e-${{ hashFiles('core/Cargo.lock') }}
      - run: cargo test -p core-api --test e2e
        working-directory: core
        env:
          SIEGEL_TEST_SERVER_URL: http://localhost:58080
      - if: failure()
        run: docker compose logs --tail=100 server

  # Deploys main to Hetzner once CI is green. Inert until the DEPLOY_HOST variable is set (docs/deploy.md).
  deploy:
    needs: [server, core, core-web, app, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    environment: production
    steps:
      - name: ssh deploy (forced command runs scripts/deploy.sh)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy && echo "$SSH_KEY" > ~/.ssh/deploy
          ssh -i ~/.ssh/deploy deploy@${{ vars.DEPLOY_HOST }}
